# ============================================================
# DRAS India-Specific Disaster Damage Training Config (v2.0)
# ============================================================
# Implements balanced class weighting, focal loss, and geographic splits.

experiment:
  id: "india_v2_balanced_finetune"
  version: "2.0.0"
  description: "Class-weighted fine-tuning on Chamoli 2021 + Cyclone Fani 2019 with zero-shot generalisation testing on Dharali 2025"
  date: "2026-09-17"

model:
  architecture: "unet"
  encoder: "resnet34"
  mode: "pre_post"
  in_channels: 6
  num_classes: 5
  pretrained_weights: "ai-service/models/unet_resnet34_pre_post.pth"
  freeze_encoder: false

training:
  epochs: 5
  batch_size: 4
  learning_rate: 0.0001
  optimizer: "adam"
  weight_decay: 0.0001
  loss_type: "ce_dice"  # options: ce_dice, focal_dice, ce_only
  use_class_weights: true
  # Inverse frequency weights: Background (0.1), No-Damage (1.0), Minor (3.0), Major (3.0), Destroyed (5.0)
  class_weights: [0.15, 1.0, 3.5, 3.0, 5.0]
  focal_gamma: 2.0
  lr_scheduler: "cosine"
  val_fraction: 0.20
  random_seed: 42

augmentation:
  horizontal_flip: true
  vertical_flip: true
  random_rotate_90: true
  color_jitter: true
  brightness: 0.1
  contrast: 0.1

dataset:
  manifest: "data/india/india_manifest.csv"
  data_dir: "data/india"
  train_events:
    - "chamoli_2021"
    - "fani_2019"
  validation_events:
    - "chamoli_2021"
    - "fani_2019"
  test_events:
    - "dharali_2025"
  image_size: [512, 512]

output:
  checkpoint_dir: "models/india_v2"
  best_model_name: "best_model.pth"
  final_model_name: "final_model.pth"
  training_log: "outputs/india_evaluation/india_v2_training_log.json"
